name: Build mod jar

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - name: Build
        run: gradle build --no-daemon
      - name: Verify jar contents
        run: |
          ls -la build/libs
          unzip -l build/libs/aimtracker-1.0.1.jar | grep -E "fabric.mod.json|AimTrackerClient.class"
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: aimtracker-jar
          path: build/libs/aimtracker-1.0.1.jar
